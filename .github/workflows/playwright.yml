name: BuildPiper Playwright Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: self-hosted
    environment: Planning
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Create QA environment file
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          {
            echo "BASE_URL=$BASE_URL"
            echo "API_BASE_URL=$API_BASE_URL"
            echo "APP_USERNAME=$APP_USERNAME"
            echo "APP_PASSWORD=$APP_PASSWORD"
          } > .env.qa

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run dashboard tests
        run: |
          npx playwright test \
            tests/ui/clusterDashboard.spec.ts \
            --project=chromium \
            --workers=2

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -type f -print -quit)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found; skipping report generation."
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Allure report to GitHub Pages
        if: always() && hashFiles('allure-report/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    name: Deploy Allure Report
    needs: ui-tests
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4